name: Create release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AmiDiskLab.slnx
      - run: dotnet test AmiDiskLab.slnx --no-restore --configuration Release -p:UsedAvaloniaProducts=

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            artifact: AmiDiskLab-Windows-x64
          - runner: ubuntu-latest
            rid: linux-x64
            artifact: AmiDiskLab-Linux-x64
          - runner: macos-latest
            rid: osx-x64
            artifact: AmiDiskLab-macOS-Intel
          - runner: macos-latest
            rid: osx-arm64
            artifact: AmiDiskLab-macOS-Apple-Silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained application
        run: >-
          dotnet publish RetroDisk.App/AmiDiskLab.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:UsedAvaloniaProducts=
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath '${{ matrix.artifact }}.zip'
      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x publish/AmiDiskLab
          cp AmiDiskLab_256.png publish/AmiDiskLab.png
          cp packaging/linux/install-user.sh packaging/linux/uninstall-user.sh publish/
          chmod +x publish/install-user.sh publish/uninstall-user.sh
          tar -C publish -czf '${{ matrix.artifact }}.tar.gz' .
      - name: Create macOS application bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' RetroDisk.App/AmiDiskLab.App.csproj)
          mkdir -p bundle/AmiDiskLab.app/Contents/MacOS bundle/AmiDiskLab.app/Contents/Resources icon.iconset
          cp -R publish/. bundle/AmiDiskLab.app/Contents/MacOS/
          chmod +x bundle/AmiDiskLab.app/Contents/MacOS/AmiDiskLab
          sips -z 16 16 AmiDiskLab_1024.png --out icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 AmiDiskLab_1024.png --out icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 AmiDiskLab_1024.png --out icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 AmiDiskLab_1024.png --out icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 AmiDiskLab_1024.png --out icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 AmiDiskLab_1024.png --out icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 AmiDiskLab_1024.png --out icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 AmiDiskLab_1024.png --out icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 AmiDiskLab_1024.png --out icon.iconset/icon_512x512.png >/dev/null
          cp AmiDiskLab_1024.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o bundle/AmiDiskLab.app/Contents/Resources/AmiDiskLab.icns
          cat > bundle/AmiDiskLab.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>AmiDiskLab</string>
            <key>CFBundleDisplayName</key><string>AmiDiskLab</string>
            <key>CFBundleIdentifier</key><string>de.gruetze-software.amidisklab</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleGetInfoString</key><string>AmiDiskLab $VERSION — Amiga Disk &amp; Software Manager</string>
            <key>CFBundleExecutable</key><string>AmiDiskLab</string>
            <key>CFBundleIconFile</key><string>AmiDiskLab</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSHumanReadableCopyright</key><string>Copyright © 2026 Christoph Schaefer / Grütze-Software</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          tar -C bundle -czf '${{ matrix.artifact }}.tar.gz' AmiDiskLab.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "AmiDiskLab ${GITHUB_REF_NAME#v}"
          fi
